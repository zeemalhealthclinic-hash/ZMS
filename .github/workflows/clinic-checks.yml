name: Clinic Static Checks

on:
  push:
    branches: [main, hardening/store1-store2-data-safety]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: Validate clinic HTML and scanner code
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check inline JavaScript syntax
        run: |
          python3 - <<'PY'
          import re, subprocess
          html = open("index.html", encoding="utf-8").read()
          blocks = [b for b in re.findall(r"<script(?![^>]*\bsrc=)[^>]*>([\s\S]*?)</script>", html) if b.strip()]
          assert blocks, "no inline scripts"
          for i, b in enumerate(blocks, 1):
              open(f"/tmp/s{i}.js", "w", encoding="utf-8").write(b)
              subprocess.run(["node", "--check", f"/tmp/s{i}.js"], check=True)
          print("syntax OK", len(blocks))
          PY
      - name: Check scanner
        run: |
          python3 - <<'PY'
          html = open("index.html", encoding="utf-8").read()
          sw = open("sw.js", encoding="utf-8").read()
          need = ["@zxing/library@0.21.3", "MultiFormatReader", "HTMLCanvasElementLuminanceSource",
                  "function grabFrame", "function waitForVideoFrames", "function closeCamera()",
                  "BarcodeFormat.QR_CODE", "BarcodeFormat.EAN_13", "BarcodeFormat.EAN_8",
                  "BarcodeFormat.UPC_A", "BarcodeFormat.UPC_E", "BarcodeFormat.CODE_128",
                  "BarcodeFormat.CODE_39", "BarcodeFormat.ITF"]
          missing = [n for n in need if n not in html]
          assert not missing, missing
          for bad in ["decodeFromVideoDevice", "decodeFromCanvas", "BrowserMultiFormatReader"]:
              assert bad not in html, "banned: " + bad
          assert "zeemal-clinic-v13" in sw, "sw cache version mismatch"
          for required in ["serverMedsCount", "Inventory safety lock", "zeemalConfirmed_", "Checking server connection", "Offline mode: records are view-only", "loadActiveStore();/* Re-read the complete server snapshot", "onSnapshot({includeMetadataChanges:true}"]:
              assert required in html, "missing data safety guard: " + required
          print("inventory safety checks OK")
          print("scanner checks OK")
          PY
      - name: Check Firestore sync safeguards and state machine
        run: |
          python3 - <<'PY'
          from pathlib import Path
          html = Path("index.html").read_text(encoding="utf-8")
          assert "onSnapshot({includeMetadataChanges:true}" in html, "metadata-only snapshots must be observed"
          assert "enablePersistence({synchronizeTabs:false})" in html, "single-tab persistence mode missing"
          assert "fbDb.disableNetwork()" in html and "fbDb.enableNetwork()" in html, "one-time network reset missing"
          assert "Server slow — close other Zeemal tabs and refresh" in html, "10-second warning missing"
          can_write = html.split("function canWrite(){", 1)[1].split("\n", 1)[0]
          cloud_push = html.split("function cloudPush(){", 1)[1].split("function applySnapshot", 1)[0]
          assert "serverSnapshotReady" in can_write, "canWrite server snapshot guard missing"
          assert "if(!serverSnapshotReady)" in cloud_push, "cloudPush server snapshot guard missing"
          assert "Number.isInteger(serverMedsCount)" in cloud_push and "Math.ceil(serverMedsCount*0.5)" in cloud_push, "inventory safety lock missing"
          assert "function markServerSnapshot(snap)" in html, "server-only readiness helper missing"
          print("Firestore sync safety guards OK")
          PY
          node tests/sync-state.mjs
      - name: Check service worker syntax
        run: node --check sw.js
