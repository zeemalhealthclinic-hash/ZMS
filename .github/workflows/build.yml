name: Build Clinic Apps

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master
      - feature/secure-store-login
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  android:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Get source code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies (retry transient downloads)
        env:
          npm_config_sharp_binary_host: https://npmmirror.com/mirrors/sharp
          npm_config_sharp_libvips_binary_host: https://npmmirror.com/mirrors/sharp-libvips
        run: |
          for attempt in 1 2 3; do
            if npm install --no-audit --no-fund; then
              exit 0
            fi
            if [ "$attempt" -eq 3 ]; then
              echo "::error::Dependency installation failed after 3 attempts."
              exit 1
            fi
            echo "Dependency download failed on attempt $attempt; retrying..."
            sleep $((attempt * 10))
          done

      - name: Prepare bundled app files for offline-first Android
        run: |
          mkdir -p www
          cp index.html www/index.html
          for f in manifest.json sw.js zeemal-health-clinic-logo.png zeemal-health-clinic-logo.svg; do
            if [ -f "$f" ]; then cp "$f" "www/$f"; fi
          done
          test -s www/index.html
          echo "Android will use bundled clinic files instead of GitHub Pages."
          # Bundle Firebase compat SDKs too, so the app shell can start without CDN access.
          curl -fsSL https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js -o www/firebase-app-compat.js
          curl -fsSL https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js -o www/firebase-auth-compat.js
          curl -fsSL https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js -o www/firebase-firestore-compat.js
          python3 - <<'PY'
          from pathlib import Path
          p=Path('www/index.html')
          s=p.read_text(encoding='utf-8')
          for name in ('firebase-app-compat.js','firebase-auth-compat.js','firebase-firestore-compat.js'):
              s=s.replace('https://www.gstatic.com/firebasejs/10.12.2/'+name, './'+name)
          p.write_text(s,encoding='utf-8')
          PY
          test -s www/firebase-app-compat.js
          test -s www/firebase-auth-compat.js
          test -s www/firebase-firestore-compat.js

      - name: Create Android project
        run: npx cap add android

      - name: Generate Zeemal Android launcher icon
        run: |
          mkdir -p assets
          test -f zeemal-health-clinic-logo.svg
          sudo apt-get update
          sudo apt-get install -y imagemagick
          convert -background none zeemal-health-clinic-logo.svg -resize 1024x1024 assets/icon.png
          npx capacitor-assets generate --android

      # Same signing key on every build, so the SHA-1 saved in Firebase always matches.
      - name: Install signing key
        env:
          DEBUG_KEYSTORE_BASE64: ${{ secrets.DEBUG_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$DEBUG_KEYSTORE_BASE64" ]; then
            echo "::error::GitHub Secret DEBUG_KEYSTORE_BASE64 is missing. Add it in Settings > Secrets and variables > Actions."
            exit 1
          fi
          mkdir -p ~/.android
          printf '%s' "$DEBUG_KEYSTORE_BASE64" | base64 -d > ~/.android/debug.keystore
          keytool -list -keystore ~/.android/debug.keystore -storepass android 2>/dev/null | grep -i "androiddebugkey" || { echo "::error::Signing key is invalid"; exit 1; }

      # Force Gradle to sign the APK with OUR key (the one registered in Firebase).
      - name: Use our signing key for the APK
        run: |
          cp ~/.android/debug.keystore android/app/zeemal-debug.keystore
          cat >> android/app/build.gradle <<'GRADLE'

          android {
              signingConfigs {
                  debug {
                      storeFile file('zeemal-debug.keystore')
                      storePassword 'android'
                      keyAlias 'androiddebugkey'
                      keyPassword 'android'
                  }
              }
          }
          GRADLE
          tail -15 android/app/build.gradle

      - name: Add google-services.json
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          if [ -z "$GOOGLE_SERVICES_JSON" ]; then
            echo "::error::GitHub Secret GOOGLE_SERVICES_JSON is missing. Add it in Settings > Secrets and variables > Actions."
            exit 1
          fi
          printf '%s' "$GOOGLE_SERVICES_JSON" > android/app/google-services.json
          node -e "
            const j=JSON.parse(require('fs').readFileSync('android/app/google-services.json','utf8'));
            const c=(j.client||[]).find(x=>x.client_info&&x.client_info.android_client_info.package_name==='com.zeemal.healthclinic');
            if(!c){console.error('::error::google-services.json is not for package com.zeemal.healthclinic');process.exit(1)}
            const hashes=((c.oauth_client||[]).map(o=>o.android_info&&o.android_info.certificate_hash).filter(Boolean));
            console.log('SHA-1 hashes in google-services.json:',hashes.join(', ')||'(none)');
            if(!hashes.includes('93fa080586bcae98308a6f9aa2c7aa8d3a9ee40e')){console.error('::error::SHA-1 93:FA:08... is missing in google-services.json. Add the fingerprint in Firebase, then download google-services.json again.');process.exit(1)}
            console.log('google-services.json OK');
          "

      - name: Enable native Google sign-in and camera
        run: |
          sed -i "s/^ext {/ext {\n    rgcfaIncludeGoogle = true\n    androidxCredentialsVersion = '1.3.0'/" android/variables.gradle
          python3 - <<'PY'
          from pathlib import Path
          import xml.etree.ElementTree as ET

          p = Path("android/app/src/main/AndroidManifest.xml")
          tree = ET.parse(p)
          root = tree.getroot()
          ns = "{http://schemas.android.com/apk/res/android}"

          camera = "http://schemas.android.com/apk/res/android"
          ET.register_namespace("android", camera)

          # Add camera permission and optional camera feature using proper XML namespace.
          for tag, attrs in [
              ("uses-permission", {ns + "name": "android.permission.CAMERA"}),
              ("uses-feature", {ns + "name": "android.hardware.camera", ns + "required": "false"}),
          ]:
              if not any(child.tag == tag and child.get(ns + "name") == attrs[ns + "name"] for child in root):
                  el = ET.Element(tag, attrs)
                  app_index = next((i for i, child in enumerate(root) if child.tag == "application"), len(root))
                  root.insert(app_index, el)

          tree.write(p, encoding="utf-8", xml_declaration=True)
          ET.parse(p)
          print("Manifest valid; camera permission added with Android namespace")
          PY
          echo "---- variables.gradle ----"
          cat android/variables.gradle
          echo "---- plugin Gradle Google/credentials settings ----"
          grep -n -i "rgcfa\|credentials\|googleid\|play-services-auth" node_modules/@capacitor-firebase/authentication/android/build.gradle || true

      - name: Sync Android project
        run: npx cap sync android

      - name: Explicitly configure Zeemal adaptive launcher icons
        run: |
          mkdir -p android/app/src/main/res/mipmap-anydpi-v26 android/app/src/main/res/values
          test -s android/app/src/main/res/mipmap-xxxhdpi/ic_launcher_foreground.png
          cat > android/app/src/main/res/mipmap-anydpi-v26/ic_launcher.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <adaptive-icon xmlns:android="http://schemas.android.com/apk/res/android">
              <background android:drawable="@color/zeemal_launcher_background" />
              <foreground android:drawable="@mipmap/ic_launcher_foreground" />
          </adaptive-icon>
          EOF
          cat > android/app/src/main/res/mipmap-anydpi-v26/ic_launcher_round.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <adaptive-icon xmlns:android="http://schemas.android.com/apk/res/android">
              <background android:drawable="@color/zeemal_launcher_background" />
              <foreground android:drawable="@mipmap/ic_launcher_foreground" />
          </adaptive-icon>
          EOF
          cat > android/app/src/main/res/values/zeemal_launcher_background.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <color name="zeemal_launcher_background">#FFFFFF</color>
          </resources>
          EOF
          echo "Zeemal adaptive icon XML and foreground image configured"
          cat android/app/src/main/res/mipmap-anydpi-v26/ic_launcher.xml

      - name: Force Zeemal launcher icon in Android manifest
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import xml.etree.ElementTree as ET

          p = Path("android/app/src/main/AndroidManifest.xml")
          tree = ET.parse(p)
          root = tree.getroot()
          app = root.find("application")
          if app is None:
              raise SystemExit("AndroidManifest.xml has no application element")

          android_ns = "{http://schemas.android.com/apk/res/android}"
          ET.register_namespace("android", "http://schemas.android.com/apk/res/android")
          app.set(android_ns + "icon", "@mipmap/ic_launcher")
          app.set(android_ns + "roundIcon", "@mipmap/ic_launcher_round")
          tree.write(p, encoding="utf-8", xml_declaration=True)
          raw = p.read_text(encoding="utf-8")
          if 'xmlns:android="http://schemas.android.com/apk/res/android"' not in raw:
              raise SystemExit("Android namespace declaration missing after manifest update")

          # Parse again to verify the generated XML is valid and attributes are unique.
          check = ET.parse(p).getroot().find("application")
          assert check.get(android_ns + "icon") == "@mipmap/ic_launcher"
          assert check.get(android_ns + "roundIcon") == "@mipmap/ic_launcher_round"
          print("Valid manifest: Zeemal launcher icons configured")
          PY
          echo "---- Confirm launcher resources ----"
          find android/app/src/main/res -type f | sort | grep -E 'mipmap.*/ic_launcher'
          test -f android/app/src/main/res/mipmap-hdpi/ic_launcher.png
          test -f android/app/src/main/res/mipmap-xxxhdpi/ic_launcher.png

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Cache Gradle downloads
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper/dists
          key: gradle-${{ runner.os }}-${{ hashFiles('android/**/*.gradle*', 'android/gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: |
            gradle-${{ runner.os }}-

      - name: Build APK (longer wrapper timeout + retry)
        run: |
          cd android
          chmod +x gradlew
          # GitHub runners sometimes respond slowly while downloading Gradle.
          sed -i '/^distributionUrl=/i networkTimeout=120000' gradle/wrapper/gradle-wrapper.properties
          for attempt in 1 2 3; do
            if ./gradlew --no-daemon assembleDebug; then
              exit 0
            fi
            if [ "$attempt" -eq 3 ]; then
              echo "::error::Gradle APK build failed after 3 attempts."
              exit 1
            fi
            echo "Gradle download/build failed on attempt $attempt; retrying..."
            sleep $((attempt * 15))
          done

      # Prints the real signing fingerprint of the finished APK, so it can be compared with Firebase.
      - name: Show APK signing fingerprint
        run: |
          BT="$ANDROID_HOME/build-tools/$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -1)"
          echo "---- APK certificate (must be SHA-1 93:FA:08:05... = 93fa0805...) ----"
          "$BT/apksigner" verify --print-certs android/app/build/outputs/apk/debug/app-debug.apk | grep -i "SHA-1\|SHA-256" || true
          echo "---- Key stored in GitHub secret ----"
          keytool -list -v -keystore ~/.android/debug.keystore -storepass android 2>/dev/null | grep -i "SHA1\|SHA256" || true

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Zeemal-Health-Clinic-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk

  windows:
    name: Build Windows EXE
    runs-on: windows-latest

    steps:
      - name: Get source code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      # The Windows app is built in its own small folder (winapp) so that the
      # Android/Capacitor packages in the main package.json cannot break it.
      - name: Prepare Windows app folder
        shell: bash
        run: |
          mkdir -p winapp/electron
          cp electron/main.js winapp/electron/main.js
          cp electron/preload.js winapp/electron/preload.js
          cp index.html winapp/index.html
          for f in sw.js manifest.json zeemal-health-clinic-logo.png zeemal-health-clinic-logo.svg; do
            if [ -f "$f" ]; then cp "$f" "winapp/$f"; fi
          done
          cat > winapp/package.json <<'EOF'
          {
            "name": "zeemal-health-clinic",
            "version": "1.0.0",
            "description": "Zeemal Health Clinic Management System",
            "author": "Zeemal Health Clinic",
            "main": "electron/main.js",
            "devDependencies": {
              "electron": "^40.0.0",
              "electron-builder": "^26.0.0"
            },
            "build": {
              "appId": "com.zeemal.healthclinic",
              "productName": "Zeemal Health Clinic",
              "directories": { "output": "dist" },
              "files": [
                "electron/**/*",
                "index.html",
                "sw.js",
                "manifest.json",
                "zeemal-health-clinic-logo.*",
                "firebase-*-compat.js",
                "package.json"
              ],
              "win": {
                "target": ["nsis", "portable"],
                "signAndEditExecutable": false
              },
              "nsis": {
                "oneClick": false,
                "allowToChangeInstallationDirectory": true,
                "createDesktopShortcut": true,
                "createStartMenuShortcut": true,
                "artifactName": "Zeemal-Health-Clinic-Setup-${version}.${ext}"
              },
              "portable": {
                "artifactName": "Zeemal-Health-Clinic-Portable-${version}.${ext}"
              },
              "toolsets": {
                "sevenZip": {
                  "url": "https://repo.huaweicloud.com/electron-builder-binaries/7zip@1.0.0/7zip-win-x64.tar.gz",
                  "checksum": "db50b64348d9560b875a00bd7e02f02b5f7f4b54ff5efa5908c38858c89c9f33",
                  "version": "1.0.0"
                }
              }
            }
          }
          EOF
          node -e "JSON.parse(require('fs').readFileSync('winapp/package.json','utf8'));console.log('winapp/package.json is valid')"
          # Keep Firebase SDK files inside the Windows app for offline startup.
          curl -fsSL https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js -o winapp/firebase-app-compat.js
          curl -fsSL https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js -o winapp/firebase-auth-compat.js
          curl -fsSL https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js -o winapp/firebase-firestore-compat.js
          python3 - <<'PY'
          from pathlib import Path
          p=Path('winapp/index.html')
          s=p.read_text(encoding='utf-8')
          for name in ('firebase-app-compat.js','firebase-auth-compat.js','firebase-firestore-compat.js'):
              s=s.replace('https://www.gstatic.com/firebasejs/10.12.2/'+name, './'+name)
          p.write_text(s,encoding='utf-8')
          PY
          ls -R winapp

      - name: Cache Windows Electron downloads
        uses: actions/cache@v4
        with:
          path: |
            ~\AppData\Local\electron\Cache
            ~\AppData\Local\electron-builder\Cache
          key: windows-electron-${{ hashFiles('winapp/package.json') }}
          restore-keys: |
            windows-electron-

      - name: Install Windows build tools (mirror + retry)
        working-directory: winapp
        env:
          ELECTRON_MIRROR: https://npmmirror.com/mirrors/electron/
        run: |
          $ErrorActionPreference = "Stop"
          for ($attempt = 1; $attempt -le 3; $attempt++) {
            npm install --no-audit --no-fund
            if ($LASTEXITCODE -eq 0) {
              exit 0
            }
            if ($attempt -eq 3) {
              throw "Windows dependency installation failed after 3 attempts."
            }
            Write-Host "Dependency download failed on attempt $attempt; retrying..."
            Start-Sleep -Seconds (10 * $attempt)
          }

      - name: Build EXE (retry transient download failures)
        working-directory: winapp
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
          ELECTRON_MIRROR: https://npmmirror.com/mirrors/electron/
        run: |
          $ErrorActionPreference = "Stop"
          for ($attempt = 1; $attempt -le 3; $attempt++) {
            npx electron-builder --win --publish never
            if ($LASTEXITCODE -eq 0) {
              exit 0
            }
            if ($attempt -eq 3) {
              throw "Windows EXE packaging failed after 3 attempts."
            }
            Write-Host "Electron packaging/download failed on attempt $attempt; retrying..."
            Start-Sleep -Seconds (15 * $attempt)
          }

      - name: Show build output
        shell: bash
        run: ls -la winapp/dist

      - name: Upload EXE files
        uses: actions/upload-artifact@v4
        with:
          name: Zeemal-Health-Clinic-Windows
          path: winapp/dist/*.exe
          if-no-files-found: error
